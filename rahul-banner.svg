<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Kumar — Software, Data, AI and Creative Engineering</title>
  <desc id="desc">A dark editorial banner with ultraviolet and cyan gradients, an abstract circuit grid, and Rahul Kumar's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D18"/>
      <stop offset="0.55" stop-color="#12132B"/>
      <stop offset="1" stop-color="#101D2D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="40%" r="58%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A5B4FC" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <path d="M725 0H1200V300H895L1020 214L928 151L1086 51Z" fill="#8B5CF6" opacity="0.09"/>
  <path d="M790 300L958 134H1054L888 300Z" fill="#22D3EE" opacity="0.07"/>
  <g fill="none" stroke="url(#beam)" stroke-width="2" opacity="0.8">
    <path d="M770 64H885V112H958"/>
    <path d="M850 190H932V228H1030V194H1146"/>
    <path d="M998 35V76H1082V112H1170"/>
    <path d="M1032 267V247H1110V218H1180"/>
  </g>
  <g fill="#22D3EE" filter="url(#softGlow)">
    <circle cx="958" cy="112" r="4"/><circle cx="1030" cy="194" r="4"/><circle cx="1082" cy="76" r="4"/><circle cx="1110" cy="247" r="4"/>
  </g>
  <g transform="translate(844 75)" fill="none" stroke-width="2.3">
    <rect x="0" y="0" width="242" height="154" rx="18" stroke="#A78BFA" stroke-opacity="0.46"/>
    <path d="M0 33H242" stroke="#A78BFA" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="4" fill="#FB7185" stroke="none"/>
    <circle cx="35" cy="17" r="4" fill="#FBBF24" stroke="none"/>
    <circle cx="50" cy="17" r="4" fill="#34D399" stroke="none"/>
    <path d="M36 72L20 88L36 104M63 104L79 88L63 72M93 110L113 66" stroke="#22D3EE" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M137 78H211M137 94H194M137 110H176" stroke="#C4B5FD" stroke-linecap="round" opacity="0.72"/>
  </g>
  <rect x="62" y="58" width="5" height="110" rx="2.5" fill="url(#beam)"/>
  <text x="91" y="105" fill="#A5B4FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">ENGINEERING × CREATIVITY</text>
  <text x="88" y="165" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">RAHUL KUMAR</text>
  <text x="92" y="204" fill="#D1D5DB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500">Software  /  Data  /  AI  /  Digital Fabrication</text>
  <g transform="translate(92 237)">
    <rect x="0" y="0" width="104" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.65"/>
    <text x="52" y="18.5" text-anchor="middle" fill="#67E8F9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">BUILD</text>
    <rect x="116" y="0" width="104" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.13" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="168" y="18.5" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">ANALYZE</text>
    <rect x="232" y="0" width="104" height="28" rx="14" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.7"/>
    <text x="284" y="18.5" text-anchor="middle" fill="#FDA4AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">CREATE</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#94A3B8" stroke-opacity="0.2"/>
</svg>
